{# Interrupteur : une vraie case à cocher, présentée comme un interrupteur (role="switch"). #}
<c-vars field />
<label class="switch" for="{{ field.id_for_label }}">
  <span class="sl">{{ field.label }}{% if field.help_text %}<small id="{{ field.id_for_label }}-aide">{{ field.help_text }}</small>{% endif %}</span>
  <input type="checkbox" role="switch" id="{{ field.id_for_label }}" name="{{ field.html_name }}" {% if field.value %}checked{% endif %} {% if field.help_text %}aria-describedby="{{ field.id_for_label }}-aide"{% endif %}>
  <span class="track" aria-hidden="true"></span>
</label>
